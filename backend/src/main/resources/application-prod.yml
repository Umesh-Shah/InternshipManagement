cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT secret — no default here; application fails at startup if JWT_SECRET is not set.
jwt:
  secret: ${JWT_SECRET}
  cookie:
    secure: true

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    ca.uwindsor.ims: INFO
