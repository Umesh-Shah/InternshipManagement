cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT secret — no default here; application fails at startup if JWT_SECRET is not set.
jwt:
  secret: ${JWT_SECRET}
  cookie:
    secure: true

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  structured:
    format:
      console: ecs
      file: ecs
    ecs:
      service:
        name: ims-backend
        environment: production
  level:
    root: WARN
    # Change to DEBUG to see detailed service/controller logs for debugging.
    # Can also be overridden without editing this file via env var:
    #   LOGGING_LEVEL_CA_UWINDSOR_IMS=DEBUG
    ca.uwindsor.ims: INFO
